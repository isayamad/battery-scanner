name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-20.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            openjdk-17-jdk \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev
      
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython
          pip install buildozer
      
      - name: Create dummy icon (if missing)
        run: |
          if [ ! -f icon.png ]; then
            python3 -c "from PIL import Image; Image.new('RGB', (512, 512), color='#1F78B4').save('icon.png')" 2>/dev/null || echo "Icon creation skipped"
          fi
          if [ ! -f presplash.png ]; then
            python3 -c "from PIL import Image; Image.new('RGB', (1024, 1024), color='#1F78B4').save('presplash.png')" 2>/dev/null || echo "Presplash creation skipped"
          fi
      
      - name: Build APK
        run: |
          echo "y" | buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: battery-scanner-apk
          path: bin/*.apk
