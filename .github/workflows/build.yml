name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            openjdk-17-jdk \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev
          
          # libtinfo5 is not available in newer Ubuntu, use libtinfo6 instead
          sudo apt install -y libtinfo6 || true
          
          # Alternative: create symlink if needed
          if [ ! -f /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true
          fi
      
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython
          pip install buildozer
      
      - name: Create dummy icons
        run: |
          python3 -c "from PIL import Image; Image.new('RGB', (512, 512), color='#1F78B4').save('icon.png')" 2>/dev/null || echo "PIL not available, skipping icon"
          python3 -c "from PIL import Image; Image.new('RGB', (1024, 1024), color='#1F78B4').save('presplash.png')" 2>/dev/null || echo "PIL not available, skipping presplash"
      
      - name: Build APK
        run: |
          echo "y" | buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: battery-scanner-apk
          path: bin/*.apk
